name: Update today.json

on:
  schedule:
    # 17:05 UTC = 00:05 Indochina Time (UTC+7) — just after midnight local time
    - cron: "5 17 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: node scripts/generate-today.js

      - name: Commit today.json if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add today.json
          git diff --staged --quiet || git commit -m "Update today.json"
          git push
