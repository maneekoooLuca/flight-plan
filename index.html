<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flight Plan</title>
<meta name="description" content="A weekly study and career-prep dashboard covering Chinese, English, interview prep, ATC, math, physics, and 3D modeling.">
<meta name="theme-color" content="#2E6F63">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png?v=2">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Flight Plan">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
</head>
<body>
<style>
  :root {
    --paper: #F6F3EA;
    --paper-raised: #FFFFFF;
    --mist: #ECE7DA;
    --line: #DCD3BE;
    --ink: #211E1A;
    --ink-soft: #5B5648;
    --ink-faint: #8A8371;
    --runway: #2E6F63;
    --runway-deep: #1F4D45;
    --runway-tint: #E3EEEB;
    --amber: #C97A2B;
    --amber-tint: #F5E6D3;
    --done: #4C8B5C;
    --done-tint: #E4EFDF;
    --skip: #9B927E;
    --skip-tint: #EFEAE0;
    --danger: #B5533F;
    --danger-tint: #F4E1DC;
    --focus-ring: #2E6F63;
    --shadow: 0 1px 2px rgba(33,30,26,0.06), 0 4px 16px rgba(33,30,26,0.06);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #14120F;
      --paper-raised: #1C1A15;
      --mist: #221F19;
      --line: #35311F;
      --ink: #EFEAE0;
      --ink-soft: #B6AF9C;
      --ink-faint: #857D68;
      --runway: #6FBBA9;
      --runway-deep: #8FD1C0;
      --runway-tint: #1A2E29;
      --amber: #E3A45C;
      --amber-tint: #2E2413;
      --done: #7FBB8B;
      --done-tint: #1B2A1C;
      --skip: #8A8371;
      --skip-tint: #211F17;
      --danger: #D4796A;
      --danger-tint: #2E1C17;
      --focus-ring: #6FBBA9;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.35);
    }
  }

  :root[data-theme="dark"] {
    --paper: #14120F;
    --paper-raised: #1C1A15;
    --mist: #221F19;
    --line: #35311F;
    --ink: #EFEAE0;
    --ink-soft: #B6AF9C;
    --ink-faint: #857D68;
    --runway: #6FBBA9;
    --runway-deep: #8FD1C0;
    --runway-tint: #1A2E29;
    --amber: #E3A45C;
    --amber-tint: #2E2413;
    --done: #7FBB8B;
    --done-tint: #1B2A1C;
    --skip: #8A8371;
    --skip-tint: #211F17;
    --danger: #D4796A;
    --danger-tint: #2E1C17;
    --focus-ring: #6FBBA9;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.35);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  h1, h2, h3, .display {
    font-family: ui-serif, "Iowan Old Style", "Palatino Linotype", Georgia, "Times New Roman", serif;
    text-wrap: balance;
    color: var(--ink);
    font-weight: 600;
  }

  .num { font-family: ui-monospace, "SF Mono", "Cascadia Code", Consolas, monospace; font-variant-numeric: tabular-nums; }

  .wrap {
    max-width: 900px;
    margin: 0 auto;
    padding: 28px 20px 80px;
  }

  /* ---- Top bar ---- */
  .topbar {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 18px;
    flex-wrap: wrap;
  }
  .topbar .brand { display: flex; align-items: baseline; gap: 10px; }
  .topbar h1 { font-size: 26px; margin: 0; letter-spacing: -0.01em; }
  .topbar .tagline { color: var(--ink-faint); font-size: 13px; }
  .stat-row { display: flex; gap: 10px; }
  .stat {
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 8px 14px;
    text-align: center;
    min-width: 74px;
  }
  .stat .n { font-size: 19px; font-weight: 700; color: var(--runway-deep); display:block; }
  .stat .l { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-faint); }

  .sync-btn {
    display: flex; align-items: center; gap: 6px;
    background: var(--paper-raised); border: 1px solid var(--line); border-radius: 10px;
    padding: 0 14px; height: 100%; min-width: 74px; cursor: pointer;
    font-size: 11.5px; font-weight: 600; color: var(--ink-soft);
  }
  .sync-btn:hover { border-color: var(--ink-faint); }
  .sync-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--skip); flex-shrink: 0; }
  .sync-dot.on { background: var(--done); }
  .sync-dot.err { background: var(--danger); }
  .sync-dot.busy { background: var(--amber); }

  .sync-panel { display: none; margin-bottom: 18px; }
  .sync-panel.open { display: block; }
  .sync-panel .card { margin-bottom: 0; }
  .sync-panel .sp-row { margin-bottom: 14px; }
  .sync-panel .sp-row:last-child { margin-bottom: 0; }
  .sync-panel .sp-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-faint); margin-bottom: 6px; }
  .sync-panel .sp-code-row { display: flex; gap: 8px; }
  .sync-panel input[type="text"] {
    flex: 1; background: var(--mist); border: 1px solid var(--line); border-radius: 8px;
    padding: 9px 11px; font-size: 14px; font-family: ui-monospace, monospace; color: var(--ink);
    letter-spacing: 0.03em;
  }
  .sync-panel .sp-note { font-size: 12px; color: var(--ink-faint); margin-top: 8px; line-height: 1.5; }
  .sync-panel .sp-status { font-size: 12.5px; color: var(--ink-soft); display: flex; align-items: center; gap: 7px; }

  /* ---- Tabs ---- */
  .tabbar {
    display: flex;
    gap: 2px;
    overflow-x: auto;
    border-bottom: 1px solid var(--line);
    margin-bottom: 20px;
    scrollbar-width: thin;
  }
  .tabbar button {
    background: none; border: none; cursor: pointer;
    padding: 9px 13px; font-size: 12.5px; font-weight: 600;
    color: var(--ink-faint); white-space: nowrap;
    border-bottom: 2px solid transparent; margin-bottom: -1px;
  }
  .tabbar button:hover { color: var(--ink); }
  .tabbar button.active { color: var(--runway-deep); border-bottom-color: var(--runway); }

  .panel { display: none; }
  .panel.active { display: block; }

  /* ---- Week strip ---- */
  .weeknav {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
  }
  .weeknav button.arrow {
    background: none; border: 1px solid var(--line); color: var(--ink-soft);
    border-radius: 8px; width: 30px; height: 30px; cursor: pointer; font-size: 14px;
  }
  .weeknav button.arrow:hover { background: var(--mist); }
  .weeknav .range { font-size: 12.5px; color: var(--ink-faint); flex: 1; text-align: center; }
  .weeknav .today-btn {
    background: none; border: 1px solid var(--line); color: var(--runway-deep);
    border-radius: 8px; padding: 5px 11px; font-size: 12.5px; cursor: pointer; font-weight: 600;
  }
  .weeknav .today-btn:hover { background: var(--runway-tint); }

  .strip {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
    margin-bottom: 26px;
  }
  .day-chip {
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 9px 4px 10px;
    text-align: center;
    cursor: pointer;
    position: relative;
  }
  .day-chip:hover { border-color: var(--ink-faint); }
  .day-chip.selected { border-color: var(--runway); box-shadow: 0 0 0 1px var(--runway); }
  .day-chip.is-today .dnum { color: var(--runway-deep); }
  .day-chip .dow { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-faint); display: block; }
  .day-chip .dnum { font-size: 16px; font-weight: 700; margin-top: 1px; display: block; }
  .day-chip .dots { display: flex; justify-content: center; gap: 3px; margin-top: 6px; height: 6px; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--line); }
  .dot.done { background: var(--done); }
  .dot.rest { background: var(--skip); }
  .dot.partial { background: var(--amber); }

  /* ---- Card ---- */
  .card {
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-radius: 16px;
    box-shadow: var(--shadow);
    padding: 24px 26px 22px;
    margin-bottom: 20px;
  }
  .card-head {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
    margin-bottom: 4px;
  }
  .card-head h2 { font-size: 21px; margin: 0 0 2px; }
  .card-head .sub { color: var(--ink-faint); font-size: 13px; }

  .daytype-toggle {
    display: flex;
    background: var(--mist);
    border-radius: 9px;
    padding: 3px;
    gap: 2px;
    flex-shrink: 0;
  }
  .daytype-toggle button {
    border: none; background: none; padding: 6px 11px; border-radius: 7px;
    font-size: 12.5px; font-weight: 600; color: var(--ink-soft); cursor: pointer;
  }
  .daytype-toggle button.active { background: var(--paper-raised); color: var(--runway-deep); box-shadow: var(--shadow); }

  .progress-ring-wrap { display: flex; align-items: center; gap: 10px; margin: 14px 0 18px; }
  .progress-ring-wrap .plabel { font-size: 12.5px; color: var(--ink-faint); }
  .progress-ring-wrap .plabel b { color: var(--ink); font-family: ui-monospace, monospace; }

  .rest-banner {
    background: var(--skip-tint);
    border: 1px dashed var(--skip);
    border-radius: 12px;
    padding: 16px 18px;
    color: var(--ink-soft);
    font-size: 13.5px;
    text-align: center;
  }
  .rest-banner b { color: var(--ink); }

  .section { margin-top: 18px; }
  .section:first-of-type { margin-top: 0; }
  .section-title {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11.5px;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    color: var(--ink-faint);
    margin-bottom: 9px;
  }
  .section-title .line { flex: 1; height: 1px; background: var(--line); }
  .section-title.optional { color: var(--amber); }

  .info-banner {
    background: var(--runway-tint);
    border-radius: 10px;
    padding: 9px 12px;
    font-size: 12.5px;
    color: var(--runway-deep);
    margin-bottom: 10px;
  }
  .info-banner b { color: var(--ink); }
  .info-banner.amber { background: var(--amber-tint); color: var(--amber); }
  .info-banner.amber b { color: var(--ink); }

  .task {
    display: flex;
    align-items: flex-start;
    gap: 11px;
    padding: 8px 4px;
    border-radius: 8px;
  }
  .task:hover { background: var(--mist); }
  .task input[type="checkbox"] {
    appearance: none;
    width: 19px; height: 19px;
    border: 1.5px solid var(--ink-faint);
    border-radius: 6px;
    margin-top: 1px;
    cursor: pointer;
    flex-shrink: 0;
    position: relative;
    background: var(--paper-raised);
  }
  .task input[type="checkbox"]:checked {
    background: var(--done);
    border-color: var(--done);
  }
  .task input[type="checkbox"]:checked::after {
    content: "";
    position: absolute;
    left: 5px; top: 1px;
    width: 5px; height: 10px;
    border: solid white;
    border-width: 0 2px 2px 0;
    transform: rotate(40deg);
  }
  .task input[type="checkbox"]:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }
  .task .tlabel { flex: 1; font-size: 14px; }
  .task .tlabel .tsub { display: block; color: var(--ink-faint); font-size: 12.5px; margin-top: 2px; }
  .task.done .tlabel { color: var(--ink-faint); text-decoration: line-through; text-decoration-color: var(--line); }
  .task.done .tlabel .tsub { text-decoration: none; }
  .task .tmin { font-size: 11.5px; color: var(--ink-faint); font-family: ui-monospace, monospace; white-space: nowrap; margin-top: 2px; }
  .task .topt-badge {
    font-size: 9.5px; text-transform: uppercase; letter-spacing: 0.04em;
    background: var(--amber-tint); color: var(--amber); border-radius: 5px;
    padding: 1px 5px; margin-left: 6px; font-weight: 700; vertical-align: 1px;
  }

  .vocab-chip-row { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 2px; }
  .vocab-chip { background: var(--mist); border-radius: 7px; padding: 5px 9px; font-size: 12.5px; }
  .vocab-chip b { font-family: ui-serif, serif; font-size: 14px; }
  .vocab-chip .vl { font-size: 9.5px; color: var(--ink-faint); text-transform: uppercase; margin-left: 4px; }

  .freetime-note {
    display: flex; align-items: center; gap: 8px;
    margin-top: 16px; padding: 10px 12px;
    background: var(--amber-tint); border-radius: 10px;
    font-size: 12.5px; color: var(--ink-soft);
  }

  /* ---- Reflection ---- */
  .reflect { margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--line); }
  .reflect-title { font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--ink-faint); margin-bottom: 10px; }
  .reflect-row { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; flex-wrap: wrap; }
  .reflect-row .rlabel { font-size: 13px; color: var(--ink-soft); min-width: 100px; }
  .scale { display: flex; gap: 4px; }
  .scale button {
    width: 26px; height: 26px; border-radius: 7px; border: 1px solid var(--line);
    background: var(--paper-raised); cursor: pointer; font-size: 11.5px;
    font-family: ui-monospace, monospace; color: var(--ink-soft);
  }
  .scale button.active { background: var(--runway); color: #fff; border-color: var(--runway); }
  .reflect textarea {
    width: 100%; background: var(--paper-raised); border: 1px solid var(--line);
    border-radius: 8px; padding: 8px 10px; font-size: 13px; color: var(--ink);
    font-family: inherit; resize: vertical; min-height: 40px; margin-bottom: 8px;
  }
  .reflect textarea::placeholder { color: var(--ink-faint); }

  /* ---- Dashboard ---- */
  .dash-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .dash-tile { background: var(--paper-raised); border: 1px solid var(--line); border-radius: 14px; padding: 15px 16px; }
  .dash-tile .dtitle { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-faint); margin-bottom: 8px; }
  .dash-tile .dval { font-size: 21px; font-weight: 700; font-family: ui-monospace, monospace; color: var(--ink); }
  .dash-tile .dsub { font-size: 12px; color: var(--ink-soft); margin-top: 2px; }
  .pbar { height: 6px; border-radius: 4px; background: var(--mist); overflow: hidden; margin-top: 9px; }
  .pbar > div { height: 100%; background: var(--runway); }
  .weak-list { list-style: none; margin: 0; padding: 0; }
  .weak-list li { padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 13px; display: flex; justify-content: space-between; gap: 10px; }
  .weak-list li:last-child { border-bottom: none; }
  .weak-list .wtag { font-size: 10px; text-transform: uppercase; color: var(--danger); background: var(--danger-tint); padding: 2px 6px; border-radius: 5px; font-weight: 700; white-space: nowrap; }

  /* ---- Curriculum browsers ---- */
  .day-card {
    background: var(--paper-raised); border: 1px solid var(--line); border-radius: 12px;
    padding: 13px 16px; margin-bottom: 8px; cursor: pointer;
  }
  .day-card.current { border-color: var(--runway); box-shadow: 0 0 0 1px var(--runway); }
  .day-card-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .day-card .dbadge {
    font-family: ui-monospace, monospace; font-size: 10.5px; color: var(--runway-deep);
    background: var(--runway-tint); padding: 2px 8px; border-radius: 6px; font-weight: 700; white-space: nowrap;
  }
  .day-card .dtitlex { font-weight: 600; font-size: 14px; flex: 1; }
  .day-card .chev { color: var(--ink-faint); font-size: 12px; transition: transform 0.15s; }
  .day-card.open .chev { transform: rotate(90deg); }
  .day-card-body { display: none; margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--line); font-size: 13.5px; color: var(--ink-soft); }
  .day-card.open .day-card-body { display: block; }
  .day-card-body .dl-row { margin-bottom: 9px; }
  .day-card-body .dl-label { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-faint); margin-bottom: 3px; }
  .day-card-body .dl-out { background: var(--done-tint); border-radius: 8px; padding: 8px 10px; margin-top: 6px; }
  .day-card-body .dl-out .dl-label { color: var(--done); }

  /* ---- Bank items ---- */
  .bank-toolbar { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  .bank-toolbar select {
    background: var(--paper-raised); border: 1px solid var(--line); border-radius: 8px;
    padding: 6px 10px; font-size: 12.5px; color: var(--ink); font-family: inherit;
  }
  .bank-item { background: var(--paper-raised); border: 1px solid var(--line); border-radius: 12px; padding: 13px 15px; margin-bottom: 8px; }
  .bank-item-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; cursor: pointer; }
  .bank-item .word { font-family: ui-serif, "Iowan Old Style", Georgia, serif; font-size: 16px; font-weight: 700; }
  .bank-item .pos { font-size: 11.5px; color: var(--ink-faint); font-style: italic; margin-left: 6px; }
  .bank-item .qtext { font-size: 13.5px; font-weight: 500; flex: 1; }
  .bank-item-tags { display: flex; gap: 5px; align-items: center; flex-shrink: 0; }
  .pill { font-size: 9.5px; text-transform: uppercase; letter-spacing: 0.03em; padding: 2px 7px; border-radius: 6px; font-weight: 700; white-space: nowrap; }
  .pill.lvl-b1, .pill.lvl-b2 { background: var(--runway-tint); color: var(--runway-deep); }
  .pill.lvl-c1, .pill.lvl-c2 { background: var(--amber-tint); color: var(--amber); }
  .pill.st-new { background: var(--mist); color: var(--ink-faint); }
  .pill.st-learning { background: var(--amber-tint); color: var(--amber); }
  .pill.st-mastered { background: var(--done-tint); color: var(--done); }
  .pill.st-review { background: var(--danger-tint); color: var(--danger); }
  .pill.diff-easy { background: var(--done-tint); color: var(--done); }
  .pill.diff-medium { background: var(--amber-tint); color: var(--amber); }
  .pill.diff-hard { background: var(--danger-tint); color: var(--danger); }
  .bank-item-body { display: none; margin-top: 11px; padding-top: 11px; border-top: 1px dashed var(--line); font-size: 13px; color: var(--ink-soft); }
  .bank-item.open .bank-item-body { display: block; }
  .bank-item-body div.brow { margin-bottom: 5px; }
  .bank-item-body b { color: var(--ink); }
  .bank-actions { display: flex; gap: 8px; margin-top: 10px; align-items: center; flex-wrap: wrap; }
  .btn-sm {
    background: var(--runway); color: #fff; border: none; border-radius: 7px;
    padding: 6px 12px; font-size: 12px; font-weight: 600; cursor: pointer;
  }
  .btn-sm:hover { opacity: 0.9; }
  .btn-sm.secondary { background: none; border: 1px solid var(--line); color: var(--ink-soft); }
  .btn-sm.danger { background: none; border: 1px solid var(--danger); color: var(--danger); }
  .score-select { display: flex; gap: 3px; }
  .score-select button {
    width: 24px; height: 24px; border-radius: 6px; border: 1px solid var(--line);
    background: var(--paper-raised); font-size: 11px; cursor: pointer; color: var(--ink-soft);
    font-family: ui-monospace, monospace;
  }
  .score-select button.active { background: var(--amber); color: #fff; border-color: var(--amber); }

  /* ---- Log forms ---- */
  .logform { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; margin: 14px 0; }
  .logform label { display: flex; flex-direction: column; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--ink-faint); gap: 4px; }
  .logform input, .logform select {
    background: var(--paper-raised); border: 1px solid var(--line); border-radius: 8px;
    padding: 7px 9px; font-size: 13px; color: var(--ink); width: 96px; font-family: inherit;
  }
  .logtable { width: 100%; border-collapse: collapse; font-size: 12.5px; margin-top: 6px; }
  .logtable-wrap { overflow-x: auto; }
  .logtable th, .logtable td { text-align: left; padding: 7px 9px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  .logtable th { color: var(--ink-faint); font-weight: 600; text-transform: uppercase; font-size: 10px; letter-spacing: 0.05em; }

  function dayState(dateStr) {
    if (!state.days[dateStr]) state.days[dateStr] = { dayType: "good", rest: false, checks: {}, reflection: {} };

    return state.days[dateStr];

  function weekNumberFor(dateStr) {
    var start = parseD(state.startDate);
    var d = parseD(dateStr);
    var diffDays = Math.round((d - start) / 86400000);
    var wn = Math.floor(diffDays / 7) + 1;
    return wn < 1 ? 1 : wn;
  }

  function weekdayIndexFor(dateStr) {
    var start = parseD(state.startDate);
    var d = parseD(dateStr);
    if (d < start) return 1;
    var count = 0;
    var cur = new Date(start);
    while (cur <= d) {
      var dow = cur.getDay();
      if (dow >= 1 && dow <= 5) count++;
      cur = addDays(cur, 1);
    }
    return count < 1 ? 1 : count;
  }

  function cyclePos(idx, len) {
    var zero = idx - 1;
    var cycle = Math.floor(zero / len) + 1;
    var pos = (zero % len);
    return { pos: pos, cycle: cycle };
  }

  // Progress-based pacing: cursor is a 0-based count of lessons actually
  // completed (or rested through) - NOT tied to the calendar. Skipping a day
  // without completing/resting it just leaves the cursor where it is, so the
  // same lesson is still "next up" whenever you come back to it.
  function cursorPos(cursor, len) {
    var pos = ((cursor % len) + len) % len;
    var cycle = Math.floor(cursor / len) + 1;
    return { pos: pos, cycle: cycle };
  }

  // ================= VOCAB PICKING =================
  function vocabRank(word) {
    var vs = state.vocabState[word];
    if (!vs) return 0;
    var order = { "new":0, "review":1, "learning":2, "mastered":3 };
    return order[vs.status] !== undefined ? order[vs.status] : 0;
  }
  function daysBetween(a, b) { return Math.round((parseD(b) - parseD(a)) / 86400000); }

  function ensureVocabToday(dateStr) {
    var ds = dayState(dateStr);
    if (ds.vocabToday && ds.vocabToday.length) return ds.vocabToday;
    function eligible(levels) {
      return VOCAB_SEED
        .filter(function(v){ return levels.indexOf(v[2]) !== -1; })
        .filter(function(v){
          var vs = state.vocabState[v[0]];
          if (vs && vs.lastPicked && daysBetween(vs.lastPicked, dateStr) < 3) return false;
          return true;
        })
        .sort(function(a,b){ return vocabRank(a[0]) - vocabRank(b[0]); });
    }
    var poolA = eligible(["B1","B2"]);
    var poolC1 = eligible(["C1"]);
    var pickA = poolA[0] || VOCAB_SEED.filter(function(v){ return v[2]==="B1"||v[2]==="B2"; })[0];
    var pickC1 = poolC1[0] || VOCAB_SEED.filter(function(v){ return v[2]==="C1"; })[0];
    var picks = [pickA, pickC1].filter(Boolean);
    if (state.cursors.weekday % 2 === 0) {
      var poolC2 = eligible(["C2"]);
      var pickC2 = poolC2[0] || VOCAB_SEED.filter(function(v){ return v[2]==="C2"; })[0];
      if (pickC2) picks.push(pickC2);
    }
    var words = picks.map(function(p){ return p[0]; });
    words.forEach(function(w){
      if (!state.vocabState[w]) state.vocabState[w] = { status:"new", practiceCount:0, lastPracticed:null };
      state.vocabState[w].lastPicked = dateStr;

    else if (vs.practiceCount >= 2) vs.status = "learning";
    else if (vs.status !== "mastered") vs.status = "learning";
    save();
  }

      var mLearnText = (mw.topics ? mw.topics.join(" · ") + " — " : "") + mw.learn.join(" · ") + (mw.formula ? " — " + mw.formula : "");
      sections.push({
        title:"Math · 60 min — Week " + (mcp2.pos+1) + ": " + mw.title + (mcp2.cycle>1?" (cycle "+mcp2.cycle+")":""),
        tasks:[

          { id:"math-summary", label:"Mistake summary", required:true, min:"5" }
        ]
      });
      var tIdx = (ds.threedIdx !== undefined) ? ds.threedIdx : state.cursors.threed;
      var tcp = cursorPos(tIdx, THREED_WEEKS.length);
      var tw = THREED_WEEKS[tcp.pos];
      sections.push({
        title:"3D Modeling · 1.5–2h — Week " + (tcp.pos+1) + (tcp.cycle>1?" (cycle "+tcp.cycle+")":"") + ": " + tw.learn.join(", "),
        tasks:[
          { id:"3d-learn", label:"Learn a technique — " + tw.learn.join(", "), required:true, min:"30–45" },
          { id:"3d-apply", label:"Apply — " + tw.task, required:true, min:"30–60" },
          { id:"3d-experiment", label:"Improve or experiment freely", required:false, min:"remaining" }
        ]
      });
    } else {
      var pIdx = (ds.physicsIdx !== undefined) ? ds.physicsIdx : state.cursors.physics;
      var pcp2 = cursorPos(pIdx, PHYSICS_WEEKS.length);
      var pw = PHYSICS_WEEKS[pcp2.pos];
      meta.planLabel = "Week " + (pcp2.pos + 1) + (pcp2.cycle > 1 ? " (cycle " + pcp2.cycle + ")" : "");
      var pLearnText = (pw.topics ? pw.topics.join(" · ") + " — " : "") + (pw.learn?pw.learn.join(" · "):"") + (pw.formula?" — " + pw.formula:"") + (pw.example?" (e.g. " + pw.example + ")":"");
      sections.push({
        title:"Physics · 60 min — Week " + (pcp2.pos+1) + ": " + pw.title + (pcp2.cycle>1?" (cycle "+pcp2.cycle+")":""),
        tasks:[
          { id:"phy-review", label:"Review previous topic", required:true, min:"10" },
          { id:"phy-learn", label:"Learn: " + pLearnText, required:true, min:"25" },
          { id:"phy-practice", label:"Practice — " + (pw.practice||"exercises"), required:true, min:"20" },
          { id:"phy-summary", label:"Mistake summary", required:true, min:"5" }
        ]
      });
      var tIdx2 = (ds.threedIdx !== undefined) ? ds.threedIdx : state.cursors.threed;
      var tcp2 = cursorPos(tIdx2, THREED_WEEKS.length);
      var tw2 = THREED_WEEKS[tcp2.pos];
      sections.push({
        title:"3D Modeling · 1–2h — apply Saturday's technique",
        tasks:[
          { id:"3d-project", label:"Project — " + tw2.project, required:true, min:"60–120" }
        ]
      });
    }

    return { dow: dow, sections: sections, meta: meta, dateStr: dateStr };
  }

  // Call after any checkbox/rest/day-type change so pending lessons only
  // advance once that day's plan is actually finished (or rested through).
  function isGroupComplete(ds, plan, prefix) {
    var any = false, allDone = true;
    plan.sections.forEach(function (sec) {
      if (sec.optional) return;
      sec.tasks.forEach(function (t) {
        if (t.id.indexOf(prefix) !== 0) return;
        if (t.required) { any = true; if (!ds.checks[t.id]) allDone = false; }
      });
    });
    return any && allDone;
  }
  function checkAdvance(dateStr) {
    var ds = dayState(dateStr);
    var dow = parseD(dateStr).getDay();

    if (dow >= 1 && dow <= 5) {
      if (ds.weekdayIdx === undefined) ds.weekdayIdx = state.cursors.weekday;
    } else if (dow === 6) {
      if (ds.mathIdx === undefined) ds.mathIdx = state.cursors.math;
      if (ds.threedIdx === undefined) ds.threedIdx = state.cursors.threed;
    } else {
      if (ds.physicsIdx === undefined) ds.physicsIdx = state.cursors.physics;
      if (ds.threedIdx === undefined) ds.threedIdx = state.cursors.threed;
    }

    // Rest protects your streak but does NOT skip the pending lesson forward -
    // only actually finishing the required tasks advances the cursor.
    var plan = ds.rest ? null : buildPlan(dateStr);

    if (dow >= 1 && dow <= 5) {
      if (!ds.weekdayAdvanced) {
        var doneWeekday = !ds.rest && isGroupComplete(ds, plan, "cn-") && isGroupComplete(ds, plan, "en-");
        if (doneWeekday) { state.cursors.weekday++; ds.weekdayAdvanced = true; }
      }
    } else if (dow === 6) {
      if (!ds.mathAdvanced) {
        var doneMath = !ds.rest && isGroupComplete(ds, plan, "math-");
        if (doneMath) { state.cursors.math++; ds.mathAdvanced = true; }
      }
    } else {
      if (!ds.physicsAdvanced) {
        var donePhysics = !ds.rest && isGroupComplete(ds, plan, "phy-");
        if (donePhysics) { state.cursors.physics++; ds.physicsAdvanced = true; }
      }
      if (!ds.threedAdvanced) {
        var done3d = !ds.rest && isGroupComplete(ds, plan, "3d-");
        if (done3d) { state.cursors.threed++; ds.threedAdvanced = true; }
      }
    }
  }

  function dayStatus(dateStr) {
    var ds = state.days[dateStr];
    if (!ds) return "empty";
    if (ds.rest) return "rest";
    var plan = buildPlan(dateStr);
    var anyRequired = false, anyChecked = false, allDone = true;
    plan.sections.forEach(function(sec){
      sec.tasks.forEach(function(t){
        if (t.required) {
          anyRequired = true;
          if (ds.checks[t.id]) anyChecked = true; else allDone = false;
        }
      });
    });
    if (!anyRequired) return "empty";
    if (allDone) return "done";
    if (anyChecked) return "partial";
    return "empty";
  }

  function computeStreak() {
    var streak = 0, cursor = todayD, first = true;
    while (true) {
      var ds = fmt(cursor);
      var status = dayStatus(ds);
      if (first && status === "empty") { first = false; cursor = addDays(cursor, -1); continue; }
      first = false;
      if (status === "done" || status === "rest") { streak++; cursor = addDays(cursor, -1); }
      else break;
      if (streak > 3650) break;
    }
    return streak;
  }
  function computeWeekPct(weekStartD) {
    var total = 0, done = 0;
    for (var i = 0; i < 7; i++) {
      var dd = addDays(weekStartD, i);
      if (dd > todayD) continue;
      total++;
      if (dayStatus(fmt(dd)) === "done" || dayStatus(fmt(dd)) === "rest") done++;
    }
    return total === 0 ? 0 : Math.round((done/total)*100);
  }

  // ================= TODAY TAB — RENDER =================
  var viewWeekStart = startOfWeek(todayD);
  var selectedDate = todayStr;

  function renderStrip() {
    var strip = document.getElementById("strip");
    strip.innerHTML = "";
    for (var i = 0; i < 7; i++) {
      var d = addDays(viewWeekStart, i);
      var ds = fmt(d);
      var chip = document.createElement("div");
      chip.className = "day-chip";
      if (ds === selectedDate) chip.className += " selected";
      if (ds === todayStr) chip.className += " is-today";
      var status = dayStatus(ds);
      chip.innerHTML = '<span class="dow">' + DOW_SHORT[d.getDay()] + '</span>' +
        '<span class="dnum">' + d.getDate() + '</span>' +
        '<span class="dots"><span class="dot ' + (status !== "empty" ? status : "") + '"></span></span>';
      chip.addEventListener("click", (function(ds){ return function(){ selectedDate = ds; renderToday(); }; })(ds));
      strip.appendChild(chip);
    }
    var rangeEnd = addDays(viewWeekStart, 6);
    document.getElementById("weekRange").textContent =
      viewWeekStart.toLocaleDateString(undefined, { month:"short", day:"numeric" }) + " – " +
      rangeEnd.toLocaleDateString(undefined, { month:"short", day:"numeric", year:"numeric" });
  }

  function renderStats() {
    document.getElementById("streakStat").textContent = computeStreak();
    document.getElementById("weekStat").textContent = computeWeekPct(startOfWeek(todayD)) + "%";
  }

  function scaleRow(name, value, onPick) {
    var out = '<div class="scale" data-scale="' + name + '">';
    for (var i = 1; i <= 5; i++) {
      out += '<button data-v="' + i + '" class="' + (value === i ? "active" : "") + '">' + i + '</button>';
    }
    out += '</div>';
    return out;
  }

  function renderCard() {

    var ds = dayState(selectedDate);
    var d = parseD(selectedDate);
    var label = d.toLocaleDateString(undefined, { weekday:"long", month:"long", day:"numeric" });

    var html = '<div class="card-head">' +
      '<div><h2>' + label + '</h2><div class="sub">' + plan.meta.planLabel + (selectedDate === todayStr ? " · Today" : "") + '</div></div>';

    if (plan.dow >= 1 && plan.dow <= 5) {
      html += '<div class="daytype-toggle" role="group" aria-label="Day type">' +
        '<button data-type="good" class="' + (ds.dayType === "good" && !ds.rest ? "active" : "") + '">Good day</button>' +
        '<button data-type="tired" class="' + (ds.dayType === "tired" && !ds.rest ? "active" : "") + '">Tired day</button>' +
        '<button data-type="rest" class="' + (ds.rest ? "active" : "") + '">Rest day</button>' +
        '</div>';
    } else {
      html += '<div class="daytype-toggle" role="group" aria-label="Day type">' +
        '<button data-type="rest" class="' + (ds.rest ? "active" : "") + '">Rest day</button>' +
        '</div>';
    }
    html += '</div>';

    if (ds.rest) {
      html += '<div class="rest-banner"><b>Full rest.</b> No required study today — gaming, movies, and downtime are the plan. This still counts toward your streak.</div>';
    } else {
      var totalReq = 0, doneReq = 0;
      plan.sections.forEach(function(sec){ sec.tasks.forEach(function(t){ if (t.required) { totalReq++; if (ds.checks[t.id]) doneReq++; } }); });
      var pct = totalReq ? Math.round((doneReq/totalReq)*100) : 0;
      html += '<div class="progress-ring-wrap"><svg width="34" height="34" viewBox="0 0 34 34">' +
        '<circle cx="17" cy="17" r="14" fill="none" stroke="var(--line)" stroke-width="4"/>' +
        '<circle cx="17" cy="17" r="14" fill="none" stroke="var(--done)" stroke-width="4" stroke-linecap="round" ' +
        'stroke-dasharray="' + (2*Math.PI*14).toFixed(1) + '" stroke-dashoffset="' + (2*Math.PI*14*(1-pct/100)).toFixed(1) + '" transform="rotate(-90 17 17)"/></svg>' +

      if (plan.meta.chineseDay) {
        html += '<div class="vocab-chip-row">' + plan.meta.chineseDay.vocab.map(function(v){
          return '<span class="vocab-chip"><b>' + v[0] + '</b> ' + v[1] + ' <span class="vl">' + v[2] + '</span></span>';
        }).join("") + '</div>';
      }

      plan.sections.forEach(function(sec){
        html += '<div class="section"><div class="section-title' + (sec.optional ? " optional" : "") + '"><span>' + sec.title + '</span><span class="line"></span></div>';
        if (sec.banner) html += '<div class="info-banner">' + sec.banner + '</div>';
        sec.tasks.forEach(function(t){
          var checked = !!ds.checks[t.id];
          html += '<label class="task' + (checked ? " done" : "") + '">' +
            '<input type="checkbox" data-task="' + t.id + '" ' + (checked ? "checked" : "") + '/>' +
            '<span class="tlabel">' + t.label + (!t.required ? '<span class="topt-badge">optional</span>' : '') + (t.sub ? '<span class="tsub">' + t.sub + '</span>' : '') + '</span>' +
            (t.min ? '<span class="tmin">' + t.min + ' min</span>' : '') +
            '</label>';
        });
        html += '</div>';
      });

      html += '<div class="freetime-note">🎮 Free time — gaming, movies, series, and social media stay available after required tasks.</div>';

      var refl = ds.reflection || {};
      html += '<div class="reflect">' +
        '<div class="reflect-title">Reflection</div>' +
        '<div class="reflect-row"><span class="rlabel">Energy</span>' + scaleRow("energy", refl.energy||0) + '</div>' +
        '<div class="reflect-row"><span class="rlabel">Study quality</span>' + scaleRow("quality", refl.quality||0) + '</div>' +
        '<textarea id="reflNotes" placeholder="Notes...">' + (refl.notes||"") + '</textarea>' +
        '<textarea id="reflAdjust" placeholder="Tomorrow adjustment...">' + (refl.adjustment||"") + '</textarea>' +
        '</div>';
    }

    card.innerHTML = html;

    card.querySelectorAll(".daytype-toggle button").forEach(function(btn){
      btn.addEventListener("click", function(){
        var type = btn.getAttribute("data-type");
        var dsx = dayState(selectedDate);
        if (type === "rest") { dsx.rest = !dsx.rest; }
        else { dsx.rest = false; dsx.dayType = type; }
        checkAdvance(selectedDate);
        save(); renderToday();
      });
    });
    card.querySelectorAll('input[type="checkbox"][data-task]').forEach(function(cb){
      cb.addEventListener("change", function(){
        var dsx = dayState(selectedDate);
        dsx.checks[cb.getAttribute("data-task")] = cb.checked;
        checkAdvance(selectedDate);
        save(); renderToday();
      });
    });
    card.querySelectorAll(".scale").forEach(function(sc){
      var name = sc.getAttribute("data-scale");
      sc.querySelectorAll("button").forEach(function(b){
        b.addEventListener("click", function(){
          var dsx = dayState(selectedDate);
          if (!dsx.reflection) dsx.reflection = {};
          var v = +b.getAttribute("data-v");
          dsx.reflection[name] = dsx.reflection[name] === v ? 0 : v;
          save(); renderCard();
        });
      });
    });
    var rn = card.querySelector("#reflNotes");
    if (rn) rn.addEventListener("change", function(){ var dsx = dayState(selectedDate); if (!dsx.reflection) dsx.reflection={}; dsx.reflection.notes = rn.value; save(); });
    var ra = card.querySelector("#reflAdjust");
    if (ra) ra.addEventListener("change", function(){ var dsx = dayState(selectedDate); if (!dsx.reflection) dsx.reflection={}; dsx.reflection.adjustment = ra.value; save(); });
  }

  // ================= DASHBOARD =================
  function renderDashboard() {
    var cnCp = cursorPos(state.cursors.weekday, 28), enCp = cursorPos(state.cursors.weekday, 28);
    var mCp = cursorPos(state.cursors.math, MATH_WEEKS.length);
    var pCp = cursorPos(state.cursors.physics, PHYSICS_WEEKS.length);
    var tCp = cursorPos(state.cursors.threed, THREED_WEEKS.length);

    var vocabCounts = { "new":0, "learning":0, "mastered":0, "review":0 };
    VOCAB_SEED.forEach(function(v){
      var vs = state.vocabState[v[0]];
      var status = vs ? vs.status : "new";
      vocabCounts[status] = (vocabCounts[status]||0) + 1;
    });

    var ivAnswered = 0;
    INTERVIEW_QUESTIONS.forEach(function(q){ if (state.interviewState[q.id] && state.interviewState[q.id].answered) ivAnswered++; });

    var threedDone = 0;
    THREED_WEEKS.forEach(function(w,i){ if (state.threedState[i] && state.threedState[i].completed) threedDone++; });

    function logAccuracy(log) {
      var c = 0, ic = 0;
      log.forEach(function(l){ c += (+l.correct||0); ic += (+l.incorrect||0); });
      var total = c + ic;
      return total ? Math.round((c/total)*100) : null;
    }
    var mathAcc = logAccuracy(state.mathLog);
    var physAcc = logAccuracy(state.physicsLog);

    var weak = [];
    Object.keys(state.vocabState).forEach(function(w){
      var vs = state.vocabState[w];
      if (vs.lastPracticed && daysBetween(vs.lastPracticed, todayStr) > 14 && vs.status !== "mastered") weak.push({ tag:"Vocabulary", text:w + " — not practiced in " + daysBetween(vs.lastPracticed, todayStr) + " days" });
    });
    Object.keys(state.interviewState).forEach(function(id){
      if (state.interviewState[id].needsReview) {
        var q = INTERVIEW_QUESTIONS.filter(function(x){ return x.id===id; })[0];
        if (q) weak.push({ tag:"Interview", text:q.text });
      }
    });
    if (mathAcc !== null && mathAcc < 70) weak.push({ tag:"Math", text:"Overall accuracy " + mathAcc + "% — revisit recent topics" });
    if (physAcc !== null && physAcc < 70) weak.push({ tag:"Physics", text:"Overall accuracy " + physAcc + "% — revisit recent topics" });

    var html = '<div class="dash-grid">' +
      tile("Chinese", "Day " + CHINESE_DAYS[cnCp.pos].d + " / 28", CHINESE_DAYS[cnCp.pos].title, Math.round(((cnCp.pos+1)/28)*100)) +
      tile("English", "Day " + ENGLISH_DAYS[enCp.pos].d + " / 28", ENGLISH_DAYS[enCp.pos].title, Math.round(((enCp.pos+1)/28)*100)) +
      tile("Math", "Week " + (mCp.pos+1) + " / " + MATH_WEEKS.length, MATH_WEEKS[mCp.pos].title + (mathAcc!==null?" · " + mathAcc + "% acc":""), Math.round(((mCp.pos+1)/MATH_WEEKS.length)*100)) +
      tile("Physics", "Week " + (pCp.pos+1) + " / " + PHYSICS_WEEKS.length, PHYSICS_WEEKS[pCp.pos].title + (physAcc!==null?" · " + physAcc + "% acc":""), Math.round(((pCp.pos+1)/PHYSICS_WEEKS.length)*100)) +
      tile("3D Roadmap", threedDone + " / 24 weeks", "Currently on week " + (tCp.pos+1), Math.round((threedDone/24)*100)) +
      tile("Interview Bank", ivAnswered + " / " + INTERVIEW_QUESTIONS.length, "questions practiced", Math.round((ivAnswered/INTERVIEW_QUESTIONS.length)*100)) +
      '</div>';

    html += '<div class="subhead">Vocabulary bank</div><div class="dash-grid">' +
      miniStat("New", vocabCounts.new) + miniStat("Learning", vocabCounts.learning) + miniStat("Mastered", vocabCounts.mastered) + miniStat("Review needed", vocabCounts.review) +
      '</div>';

    html += '<div class="subhead">Needs review</div><div class="card">';
    if (weak.length) {
      html += '<ul class="weak-list">' + weak.slice(0,12).map(function(w){ return '<li><span>' + w.text + '</span><span class="wtag">' + w.tag + '</span></li>'; }).join("") + '</ul>';
    } else {
      html += '<div class="empty-note">Nothing flagged yet — keep logging practice to surface weak areas here.</div>';
    }
    html += '</div>';

    document.getElementById("panel-dashboard").innerHTML = html;

    function tile(title, val, sub, pct) {
      return '<div class="dash-tile"><div class="dtitle">' + title + '</div><div class="dval">' + val + '</div><div class="dsub">' + sub + '</div>' +
        '<div class="pbar"><div style="width:' + Math.min(100,Math.max(0,pct)) + '%"></div></div></div>';
    }
    function miniStat(label, n) {
      return '<div class="dash-tile"><div class="dtitle">' + label + '</div><div class="dval">' + n + '</div></div>';
    }
  }

  // ================= WIDGET MODE =================
  function renderWidgetView() {
    var el = document.getElementById("widgetView");
    var ds = dayState(todayStr);
    var label = todayD.toLocaleDateString(undefined, { weekday:"short", month:"short", day:"numeric" });
    var html = '<div class="wtop"><span class="wtitle">&#129517; Flight Plan</span><span class="wstat"><b>' + computeStreak() + '</b> day streak</span></div>' +
      '<div class="wdate">' + label + '</div>';

    if (ds.rest) {
      html += '<div class="wrest">Resting today &mdash; no required tasks.</div>';
    } else {
      var plan = buildPlan(todayStr);
      var reqSections = plan.sections.filter(function(s){ return !s.optional; });
      var firstPerSection = [];
      reqSections.forEach(function(sec){
        var t = sec.tasks.filter(function(x){ return x.required && !ds.checks[x.id]; })[0];
        if (t) firstPerSection.push(t);
      });
      var allPending = [];
      reqSections.forEach(function(sec){ sec.tasks.forEach(function(t){ if (t.required && !ds.checks[t.id]) allPending.push(t); }); });
      var pending = firstPerSection.concat(allPending.filter(function(t){ return firstPerSection.indexOf(t) === -1; }));
      if (!pending.length) {
        html += '<div class="wdone">&#10003; All required tasks done today</div>';
      } else {
        pending.slice(0,4).forEach(function(t){
          html += '<label class="wtask"><input type="checkbox" data-wtask="' + t.id + '"><span>' + t.label + '</span></label>';
        });
        if (pending.length > 4) html += '<div class="wmore">+ ' + (pending.length-4) + ' more&hellip;</div>';
      }
    }
    html += '<div class="wfooter"><a href="' + BASE_URL + '" target="_blank" rel="noopener">Open full plan &rarr;</a></div>';
    el.innerHTML = html;
    el.querySelectorAll('[data-wtask]').forEach(function(cb){
      cb.addEventListener("change", function(){
        var dsx = dayState(todayStr);
        dsx.checks[cb.getAttribute("data-wtask")] = cb.checked;
        checkAdvance(todayStr);
        save();
        renderWidgetView();
      });
    });
  }

  function genCode() {
    var chars = "abcdefghijklmnopqrstuvwxyz0123456789", out = "";
    for (var i = 0; i < 16; i++) out += chars[Math.floor(Math.random() * chars.length)];
    return out;
  }

  function setSyncStatus(kind, text) {
    var dot = document.getElementById("syncDot");
    var label = document.getElementById("syncBtnLabel");
    if (!dot) return;
    dot.className = "sync-dot" + (kind ? " " + kind : "");

  function applyRemote(data) {
    if (!data || !data.json) return;
    var remoteUpdatedAt = data.updatedAt || 0;
    if (remoteUpdatedAt <= lastAppliedUpdatedAt) return;
    try {
      state = JSON.parse(data.json);
      lastAppliedUpdatedAt = remoteUpdatedAt;
      applyingRemote = true;
      try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {}
      refreshCurrentView();
    } catch (e) {} finally { applyingRemote = false; }
  }

  function startListening(code) {
    if (unsubscribeSnapshot) { unsubscribeSnapshot(); unsubscribeSnapshot = null; }
    unsubscribeSnapshot = docRef(code).onSnapshot(function (snap) {
      if (snap.exists) applyRemote(snap.data());
      setSyncStatus("on", "Synced");
    }, function () {
      setSyncStatus("err", "Offline");
    });
  }

  function syncPull(code) {
    if (!db) return;
    setSyncStatus("busy", "Syncing");
    docRef(code).get().then(function (snap) {
      if (snap.exists) applyRemote(snap.data());
      setSyncStatus("on", "Synced");
      startListening(code);
    }).catch(function () {
      setSyncStatus("err", "Offline");
    });
  }

  syncPush = function () {
    if (!db || applyingRemote) return;
    clearTimeout(pushTimer);
    pushTimer = setTimeout(function () {
      var now = Date.now();
      lastAppliedUpdatedAt = now;
      setSyncStatus("busy", "Syncing");
      docRef(syncCode).set({ json: JSON.stringify(state), updatedAt: now })
        .then(function () { setSyncStatus("on", "Synced"); })
        .catch(function () { setSyncStatus("err", "Offline"); });
    }, 500);
  };

  if (db) syncPull(syncCode);
  else setSyncStatus("err", "No sync");

  function renderSyncPanel() {
    var panel = document.getElementById("syncPanel");
    panel.innerHTML =
      '<div class="card">' +
        '<div class="sp-row"><div class="sp-label">This device\'s code</div>' +
          '<div class="sp-code-row"><input type="text" id="spMyCode" readonly value="' + syncCode + '"><button class="btn-sm" id="spCopy">Copy</button></div>' +
          '<div class="sp-note">Enter this exact code on your other device to connect it to the same saved progress. Anyone with this code can read or change this data, so don’t share it publicly.</div>' +
        '</div>' +
        '<div class="sp-row"><div class="sp-label">Connect to a different code</div>' +
          '<div class="sp-code-row"><input type="text" id="spOtherCode" placeholder="paste code from other device"><button class="btn-sm" id="spConnect">Connect</button></div>' +
        '</div>' +
        '<div class="sp-row sp-status" id="spStatus"></div>' +
      '</div>';
    document.getElementById("spCopy").addEventListener("click", function () {
      navigator.clipboard.writeText(syncCode).then(function () {
        var btn = document.getElementById("spCopy");
        btn.textContent = "Copied";
        setTimeout(function () { btn.textContent = "Copy"; }, 1500);
      });
    });
    document.getElementById("spConnect").addEventListener("click", function () {
      var v = document.getElementById("spOtherCode").value.trim().toLowerCase().replace(/\s+/g, "");
      var status = document.getElementById("spStatus");
      if (v.length < 12) { status.textContent = "Enter the full code from your other device."; return; }
      syncCode = v;
      localStorage.setItem(SYNC_CODE_KEY, syncCode);
      lastAppliedUpdatedAt = 0;
      renderSyncPanel();
      if (db) syncPull(syncCode);
    });
  }

  document.getElementById("syncBtn").addEventListener("click", function () {
    var panel = document.getElementById("syncPanel");
    panel.classList.toggle("open");
    if (panel.classList.contains("open")) renderSyncPanel();
  });

  if (isWidget) renderWidgetView(); else renderToday();
})();
</script>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  });
}
</script>
</body>
